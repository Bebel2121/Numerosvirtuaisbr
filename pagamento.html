<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento Aprovado</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.box{
background:#fff;
width:100%;
max-width:500px;
padding:40px;
border-radius:30px;
text-align:center;
box-shadow:0 10px 35px rgba(0,0,0,0.1);
}

h1{
font-size:40px;
color:#25D366;
margin-bottom:15px;
}

p{
color:#555;
margin-bottom:30px;
font-size:18px;
}

.buttons{
display:flex;
flex-direction:column;
gap:20px;
}

button{
padding:18px;
border:none;
border-radius:18px;
font-size:20px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#25D366,#128C7E);
color:white;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

</style>

</head>

<body>

<div class="box">

<h1>Pagamento Aprovado ✅</h1>

<p>
Seu pagamento foi recebido com sucesso.
Selecione abaixo o produto comprado:
</p>

<div class="buttons">

<button onclick="whatsapp()">
Já Comprei WhatsApp
</button>

<button onclick="telegram()">
Já Comprei Telegram
</button>

<button onclick="instagram()">
Já Comprei Instagram
</button>

</div>

</div>

<script>

function whatsapp(){

window.location.href =
"https://wa.me/5521990682259?text=Olá,%20acabei%20de%20comprar%20um%20número%20virtual%20para%20WhatsApp%20e%20o%20pagamento%20foi%20aprovado%20✅";

}

function telegram(){

window.location.href =
"https://wa.me/5521990682259?text=Olá,%20acabei%20de%20comprar%20um%20número%20virtual%20para%20Telegram%20e%20o%20pagamento%20foi%20aprovado%20✅";

}

function instagram(){

window.location.href =
"https://wa.me/5521990682259?text=Olá,%20acabei%20de%20comprar%20um%20número%20virtual%20para%20Instagram%20e%20o%20pagamento%20foi%20aprovado%20✅";

}

</script>

</body>
</html>
